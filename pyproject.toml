[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "space-charge-sim"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pyqt5",
    "mplcursors",
    "openpyxl"
]

[project.gui-scripts]
space-charge-simulator = "app.__main__:main"   # the GUI, after `pip install .`

[tool.setuptools.packages.find]
include = ["solver*", "app*", "thesis*"]       # data folders (thesis/input, thesis/Theory, ...) have no __init__.py

[tool.setuptools.package-data]
app = ["icon.png"]
